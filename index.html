<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1459a6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="농구 기록지">
  <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=15k9aEFGqJ6OAAlA83L2q-78U3spUDB3v">
  <link rel="icon" href="https://drive.google.com/uc?export=view&id=15k9aEFGqJ6OAAlA83L2q-78U3spUDB3v">
  <title>농구 기록지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 20px;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #eaf4ff, #f8fbff 60%, #d9eaff);
      color: #18314f;
    }
    main {
      width: min(100%, 420px); text-align: center; background: white;
      padding: 32px 24px; border-radius: 28px;
      box-shadow: 0 14px 38px rgba(26, 69, 119, .14);
    }
    .icon {
      width: 116px; height: 116px; border-radius: 25px; object-fit: cover;
      box-shadow: 0 6px 18px rgba(20, 89, 166, .18);
    }
    h1 { margin: 20px 0 8px; font-size: 25px; }
    p { line-height: 1.65; color: #52677e; font-size: 15px; }
    a.button {
      display: block; margin-top: 24px; padding: 16px 20px; border-radius: 14px;
      background: #1459a6; color: white; text-decoration: none; font-weight: 700;
      font-size: 17px;
    }
    .note { margin-top: 18px; font-size: 12px; color: #74869a; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="https://drive.google.com/uc?export=view&id=15k9aEFGqJ6OAAlA83L2q-78U3spUDB3v" alt="농구 아이콘"
         onerror="this.style.display='none'">
    <h1>농구 기록지</h1>
    <p>농구 활동 기록을 입력하려면<br>아래 버튼을 눌러 주세요.</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbxiM-QLfXyQ-APb7Gcdwarpz8DVaSBfRhZDMT2n-uzxJD7JC2LRN3h9cQVCX1M1au9c/exec">농구 기록지 열기</a>
    <p class="note">이 페이지는 홈 화면 아이콘을 위한 시작 페이지입니다.</p>
  </main>
</body>
</html>
